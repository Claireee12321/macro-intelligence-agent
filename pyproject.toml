[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macro-intel"
version = "0.2.0"
description = "Macro Intelligence Agent — personal macroeconomic intelligence pipeline and website data generator"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Claireee12321"},
    {name = "yukipan (original MarketBrief author)"},
]
dependencies = [
    "anthropic>=0.84.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
macro-intel = "macro_intel.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_intel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
